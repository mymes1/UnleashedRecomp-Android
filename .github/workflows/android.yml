# Builds the Android APK from source on every tag push (v*) or manual dispatch.
#
# Game-derived inputs (default.xex, default.xexp, shader.ar) cannot live in this
# public repository. They are downloaded as a zip from a direct link - e.g. a
# Google Drive "anyone with the link" share URL, or any other direct https
# download URL - which is either
#   - typed into the "Game files zip link" field when running the workflow
#     manually from the Actions tab, or
#   - stored in the repository VARIABLE `GAME_FILES_ZIP_URL` (used for tag
#     builds, and as a fallback for manual runs).
# The zip must contain default.xex, default.xexp and shader.ar (any folder
# depth). See docs/CI.md for details.
#
# Optional release signing (falls back to a debug build when unset):
#   - secret `ANDROID_KEYSTORE_BASE64`   - keystore file, base64-encoded
#   - secret `ANDROID_KEYSTORE_PASSWORD`
#   - secret `ANDROID_KEY_ALIAS`
#   - secret `ANDROID_KEY_PASSWORD`
name: Android APK

on:
  workflow_dispatch:
    inputs:
      game_files_url:
        description: "Direct download link for the game files zip (Google Drive 'anyone with the link' URL, or any direct https URL). Leave empty to use the GAME_FILES_ZIP_URL variable."
        required: false
        default: ""
        type: string
  push:
    tags: ["v*"]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "29.0.14206865"
  # Must match "builtin-baseline" in vcpkg.json.
  VCPKG_COMMIT: b322364f06308bdd24823f9d8f03fe0cc86fd46f

jobs:
  build:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Download game files (zip)
        # Manual runs get the "Game files zip link" field from the Actions tab;
        # tag builds (and manual runs with an empty field) fall back to the
        # GAME_FILES_ZIP_URL repository variable.
        env:
          URL: ${{ inputs.game_files_url || vars.GAME_FILES_ZIP_URL }}
        run: |
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::No game files link: paste a direct download link (e.g. a Google Drive 'anyone with the link' share URL) into the 'Game files zip link' field when running manually, or set the GAME_FILES_ZIP_URL repository variable (Settings → Secrets and variables → Actions) for tag builds."
            exit 1
          fi
          case "$URL" in
            *drive.google.com*)
              # gdown follows Drive's large-file confirm token for us. Force a
              # fresh install: runners may carry a stale gdown, and plain
              # "pip3 install" keeps it ("already satisfied"). Invoke through
              # "python3 -m gdown" so a stale binary on PATH cannot win.
              pip3 install --quiet --upgrade --force-reinstall gdown 2>/dev/null \
                || pip3 install --quiet --upgrade --force-reinstall --break-system-packages gdown
              # Bare file ids are accepted by every gdown version; full URLs
              # need the newer native parsing or the old --fuzzy flag.
              id=$(printf '%s' "$URL" | sed -n 's|^.*/d/\([A-Za-z0-9_-]*\)/.*$|\1|p')
              if [ -n "$id" ]; then
                python3 -m gdown "$id" -O game-files.zip
              else
                python3 -m gdown "$URL" -O game-files.zip \
                  || python3 -m gdown --fuzzy "$URL" -O game-files.zip
              fi
              ;;
            *)
              curl -fL --retry 3 -o game-files.zip "$URL"
              ;;
          esac

      - name: Stage game files
        run: |
          unzip -o -q game-files.zip -d game-files
          for f in default.xex default.xexp shader.ar; do
            found=$(find game-files -type f -name "$f" | head -n 1)
            if [ -z "$found" ]; then
              echo "::error::$f not found in the game files zip"
              exit 1
            fi
            install -m 644 "$found" "UnleashedRecompLib/private/$f"
          done
          rm -rf game-files game-files.zip

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg thirdparty/vcpkg
          git -C thirdparty/vcpkg checkout "$VCPKG_COMMIT"
          thirdparty/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm64
          max-size: 3G

      # Code-generation tools must run on the build host, so they are built in a
      # separate native pass and handed to the cross build as prebuilt binaries
      # (mirrors build_host_tools.bat + build_android_configure.bat on Windows).
      - name: Build host tools
        env:
          VCPKG_ROOT: ${{ github.workspace }}/thirdparty/vcpkg
        run: |
          cmake -S . -B out/build/host-tools -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUNLEASHED_RECOMP_HOST_TOOLS_ONLY=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build out/build/host-tools --target XenonRecomp XenosRecomp file_to_c x_decompress
          for tool in XenonRecomp XenosRecomp file_to_c x_decompress; do
            path=$(find out/build/host-tools -type f -name "$tool" | head -n 1)
            if [ -z "$path" ]; then
              echo "::error::Host tool $tool was not produced"
              exit 1
            fi
            var=$(echo "$tool" | tr '[:lower:]' '[:upper:]' | tr -d '_')
            echo "HOST_$var=$GITHUB_WORKSPACE/$path" >> "$GITHUB_ENV"
          done

      - name: Configure Android build
        env:
          VCPKG_ROOT: ${{ github.workspace }}/thirdparty/vcpkg
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          cmake -S . -B out/build/android-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=thirdparty/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_SYSTEM_VERSION=29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DUNLEASHED_RECOMP_ANDROID=ON \
            -DUNLEASHED_RECOMP_D3D12=OFF \
            -DUNLEASHED_RECOMP_HOST_XENON_RECOMP="$HOST_XENONRECOMP" \
            -DUNLEASHED_RECOMP_HOST_XENOS_RECOMP="$HOST_XENOSRECOMP" \
            -DUNLEASHED_RECOMP_HOST_FILE_TO_C="$HOST_FILETOC" \
            -DUNLEASHED_RECOMP_HOST_X_DECOMPRESS="$HOST_XDECOMPRESS" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build native libraries
        run: |
          cmake --build out/build/android-arm64 \
            --target UnleashedRecomp main_hook file_redirect_hook gsl_alloc_hook hook_impl

      - name: Stage jniLibs
        run: |
          dest=android-apk/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$dest"
          cp out/build/android-arm64/UnleashedRecomp/libmain.so "$dest/"
          for lib in libmain_hook.so libfile_redirect_hook.so libgsl_alloc_hook.so libhook_impl.so; do
            path=$(find out/build/android-arm64 -name "$lib" | head -n 1)
            if [ -z "$path" ]; then
              echo "::error::adrenotools hook library $lib was not produced"
              exit 1
            fi
            cp "$path" "$dest/"
          done
          ls -la "$dest"

      - name: Build APK
        working-directory: android-apk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/keystore.jks"
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnleashedRecomp-Android-${{ github.ref_name }}
          path: android-apk/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find android-apk/app/build/outputs/apk -name '*.apk' -print0 |
            xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber || \
            echo "No release for $GITHUB_REF_NAME yet; APK stays available as a workflow artifact."
